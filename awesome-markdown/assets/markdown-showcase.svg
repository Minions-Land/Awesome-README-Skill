<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Markdown showcase</title>
  <desc id="desc">A stylized GitHub README preview showing badges, charts, code blocks, and media cards.</desc>
  <rect width="960" height="360" fill="#f6f8fa"/>
  <rect x="36" y="30" width="888" height="300" rx="18" fill="#ffffff" stroke="#d0d7de"/>
  <text x="72" y="82" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#24292f">Awesome Markdown Skill</text>
  <rect x="72" y="108" width="112" height="26" rx="13" fill="#0969da"/>
  <text x="92" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">Mermaid</text>
  <rect x="196" y="108" width="88" height="26" rx="13" fill="#2da44e"/>
  <text x="216" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">Tables</text>
  <rect x="296" y="108" width="104" height="26" rx="13" fill="#8250df"/>
  <text x="316" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">Alerts</text>
  <rect x="72" y="166" width="240" height="106" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="96" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0969da">Flow</text>
  <circle cx="112" cy="232" r="13" fill="#0969da"/>
  <line x1="126" y1="232" x2="174" y2="232" stroke="#57606a" stroke-width="3"/>
  <circle cx="188" cy="232" r="13" fill="#2da44e"/>
  <line x1="202" y1="232" x2="250" y2="232" stroke="#57606a" stroke-width="3"/>
  <circle cx="264" cy="232" r="13" fill="#8250df"/>
  <rect x="348" y="166" width="240" height="106" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="372" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a6700">Callouts</text>
  <text x="372" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#57606a">NOTE, TIP, WARNING</text>
  <rect x="624" y="166" width="240" height="106" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="648" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#24292f">Code + Math</text>
  <text x="648" y="232" font-family="Menlo, Consolas, monospace" font-size="14" fill="#57606a">r_t = log(P_t) - log(P_t-1)</text>
  <line x1="72" y1="296" x2="864" y2="296" stroke="#d8dee4"/>
  <text x="72" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">Renderer-safe README patterns for GitHub projects.</text>
</svg>
